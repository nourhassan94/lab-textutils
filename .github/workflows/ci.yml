name: CI

on:
  push:
    branches:
      - main
  pull_request:
      branches:
        - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t textutils-tester .

      - name: Lint
        run: docker run --rm textutils-tester flake8 src tests

      - name: Test
        run: docker run --rm textutils-tester

